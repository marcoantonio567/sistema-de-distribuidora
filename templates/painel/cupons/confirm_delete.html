{% extends "painel/base_painel.html" %}

{% block painel_content %}
<h2>Excluir Cupom</h2>
<p>Tem certeza que deseja excluir o cupom <strong>{{ object.code }}</strong>?</p>
<p class="text-danger">Esta ação não pode ser desfeita.</p>

<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Sim, Excluir</button>
  <a href="{% url 'painel:cupons_list' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
