{% extends "painel/base_painel.html" %}
{% load crispy_forms_tags %}

{% block painel_content %}
<h2>{% if object %}Editar Cupom{% else %}Novo Cupom{% endif %}</h2>

<form method="post" class="mt-3">
  {% csrf_token %}
  {{ form|crispy }}

  <div class="mt-3 d-flex gap-2">
    <button type="submit" class="btn btn-primary">Salvar</button>
    <a href="{% url 'painel:cupons_list' %}" class="btn btn-secondary">Cancelar</a>
  </div>
</form>
{% endblock %}
