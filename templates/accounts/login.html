{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Login - Sistema de Autoatendimento{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h2 class="text-center mb-4">Login</h2>
                
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">Entrar</button>
                    </div>
                </form>
                
                <div class="text-center mt-3">
                    <p class="mb-1">
                        <a href="{% url 'accounts:password_reset' %}" class="text-decoration-none">Esqueceu a senha?</a>
                    </p>
                    <p>
                        Não tem uma conta? <a href="{% url 'accounts:register' %}" class="text-decoration-none">Cadastre-se</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
